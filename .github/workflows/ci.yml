name: CI - Build & Push & Bump Manifest

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pipeline-sample
  MANIFEST_REPO_OWNER: nam-3
  MANIFEST_REPO_NAME: manifest-repo
  MANIFEST_REPO_BRANCH: main
  OVERLAY_PATH: overlays/dev
  KUSTOMIZE_IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pipeline-sample

jobs:
  build-push-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      # 1️⃣ 앱 리포지토리 체크아웃
      - name: Checkout app repo
        uses: actions/checkout@v4

      # 2️⃣ 태그 버전 생성 (vYYYYMMDD-HHMMSS-<sha7>)
      - name: Set version/tag
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          DATE=$(date -u +'%Y%m%d-%H%M%S')
          echo "TAG=v${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      # 3️⃣ Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Docker 이미지 빌드 및 푸시 (latest 제거)
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}

      # 5️⃣ manifest-repo 클론
      - name: Checkout manifest repo
        run: |
          set -eux
          git clone --depth 1 "https://${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/${{ env.MANIFEST_REPO_OWNER }}/${{ env.MANIFEST_REPO_NAME }}.git"
          cd "${{ env.MANIFEST_REPO_NAME }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Cloned manifest repo:"
          git log -1 --oneline
          ls -R "${{ env.OVERLAY_PATH }}"

      # 6️⃣ yq 버전 확인 (v3.x)
      - name: Check yq version
        run: |
          yq --version || echo "yq not found"
          which yq || true

      # 7️⃣ kustomization.yaml 이미지 태그 갱신 (yq v3 문법)
      - name: Bump image tag in kustomization.yaml (yq v3)
        working-directory: ${{ env.MANIFEST_REPO_NAME }}
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
          KUSTOMIZE_IMAGE_NAME: ${{ env.KUSTOMIZE_IMAGE_NAME }}
        run: |
          set -euxo pipefail
          FILE="${{ env.OVERLAY_PATH }}/kustomization.yaml"
          echo "Updating ${FILE} image ${KUSTOMIZE_IMAGE_NAME} tag to ${TAG}"

          test -f "$FILE" || (echo "::error file=${FILE}::kustomization.yaml not found"; exit 1)

          echo "Before:"
          cat "$FILE"

          # ✅ yq v3 문법으로 newTag 업데이트
          yq w -i "$FILE" "images.(name==${KUSTOMIZE_IMAGE_NAME}).newTag" "${TAG}"

          echo "After:"
          cat "$FILE"

          # 변경 확인 (없으면 실패 처리)
          git add "

